name: sample-service
replicaCount: 2

image:
  repository: 111111111111.dkr.ecr.eu-west-2.amazonaws.com/platform-ref/sample-service
  # CI writes a sha-<gitsha> tag. Do not use latest.
  tag: "sha-unreleased"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

env:
  SERVICE_NAME: sample-service
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318

externalSecret:
  enabled: true
  secretName: sample-service-config
  remoteKey: /sample-service/example-config
  targetKey: EXAMPLE_CONFIG

serviceMonitor:
  enabled: true
  interval: 15s

podIdentity:
  roleArn: ""

networkPolicy:
  # Additional namespaces allowed to scrape / call the service.
  allowFromNamespaces:
    - argocd
    - observability
