name: sample-service
replicaCount: 2

image:
  repository: ghcr.io/example/sample-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

env:
  SERVICE_NAME: sample-service
  LOG_LEVEL: info
