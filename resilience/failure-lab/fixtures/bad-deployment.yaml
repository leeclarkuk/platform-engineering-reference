apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service-bad
  namespace: sample-service
  labels:
    app.kubernetes.io/name: sample-service-bad
    failure-lab: bad-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-service-bad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-service-bad
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
