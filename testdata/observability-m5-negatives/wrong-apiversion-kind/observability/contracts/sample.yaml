apiVersion: platform.engineering.reference/v1
kind: ConfigMap
metadata:
  name: sample
spec:
  contractVersion: "0.1.0"
  owner: platform
  workloadRef:
    name: sample
    namespace: apps
  openTelemetry:
    resourceAttributes:
      service.name: sample
      service.namespace: apps
      service.version: "0.1.0"
      deployment.environment.name: local-design
  prometheus:
    job: sample
    metrics:
      - name: up
        labels: [job, instance]
  alerts:
    maxSeverity: warning
    owner: platform
  artifacts:
    collectorConfig: observability/otel/collector-metrics.yaml
    prometheusRules: observability/prometheus/rules/sample.yml
