apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample
  namespace: apps
spec:
  selector:
    matchLabels:
      app: sample
  endpoints:
    - port: http
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sample
  namespace: apps
spec:
  groups: []
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sample
spec: {}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sample
spec:
  selector:
    matchLabels:
      app: sample
