---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: sample
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample
    spec:
      serviceAccountName: sample
      containers:
        - name: sample
          image: example.local/sample:0.1.0
