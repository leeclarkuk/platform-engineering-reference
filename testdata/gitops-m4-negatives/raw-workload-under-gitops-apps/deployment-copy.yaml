apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      serviceAccountName: sample
      containers:
        - name: sample
          image: example.local/sample:0.1.0
