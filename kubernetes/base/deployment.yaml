apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  namespace: sample-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-service
    spec:
      serviceAccountName: sample-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/example/sample-service:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: SERVICE_NAME
              value: sample-service
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
